font pango:monospace 10
for_window [class="^I3Calendar$"] floating enable, border pixel 0
bar {
    position bottom
    colors {
        background #000000
        statusline #FFFFFF
        separator #666666
        focused_workspace #83CAFA #51A2DA #FFFFFF
        active_workspace #3C6EB4 #294172 #FFFFFF
        inactive_workspace #8C8C8C #4C4C4C #888888
        urgent_workspace #EC69A0 #DB3279 #FFFFFF
    }
    status_command ~/.local/bin/i3-calendar --i3status-config ~/.config/i3status/config
}
